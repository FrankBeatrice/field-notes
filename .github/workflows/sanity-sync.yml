name: Publish Sanity posts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: field-notes-sanity-sync
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.SANITY_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Sanity content conversion
        run: node --test scripts/sync-sanity.test.mjs
      - name: Sync published Sanity documents
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
        run: node scripts/sync-sanity.mjs
      - name: Commit changed posts for GitHub Pages
        run: |
          git add _posts/
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Publish posts from Sanity"
            git push
          fi
