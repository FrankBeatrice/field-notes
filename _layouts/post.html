---
layout: default
---
<article class="post-shell">
  <header class="post-header">
    <p class="eyebrow">{{ page.category | default: 'Writing' }} · {{ page.date | date: '%B %d, %Y' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="dek">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="post-rule"></div>
  <div class="prose">
    {{ content }}
  </div>
  <a class="back-link" href="{{ '/writing/' | relative_url }}">← Back to writing</a>
</article>
